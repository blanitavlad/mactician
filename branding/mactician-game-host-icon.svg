<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mactician game host icon</title>
  <desc id="desc">The Mactician app icon with a luminous cyan play badge for an active TFT game.</desc>
  <defs>
    <radialGradient id="activeFace" cx="32%" cy="22%" r="90%">
      <stop stop-color="#7DFFE5"/>
      <stop offset=".42" stop-color="#21E8C2"/>
      <stop offset="1" stop-color="#0797D5"/>
    </radialGradient>
    <linearGradient id="activeEdge" x1="710" y1="696" x2="878" y2="888" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6BD5"/>
      <stop offset=".48" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#4EF4D0"/>
    </linearGradient>
    <filter id="activeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="210"/>
    </clipPath>
  </defs>
  <image href="mactician-app-icon.svg" x="0" y="0" width="1024" height="1024"/>
  <g clip-path="url(#squircle)">
    <circle cx="792" cy="790" r="116" fill="#22E7D0" opacity=".24" filter="url(#activeGlow)"/>
    <circle cx="792" cy="790" r="108" fill="#071125" stroke="#020714" stroke-width="12"/>
    <circle cx="792" cy="790" r="98" fill="#0A1730" stroke="url(#activeEdge)" stroke-width="10"/>
    <circle cx="792" cy="790" r="78" fill="url(#activeFace)"/>
    <path d="M772 742v96l68-48-68-48Z" fill="#071125"/>
    <path d="M746 736a75 75 0 0 1 84-11" fill="none" stroke="#FFFFFF" stroke-opacity=".46" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
