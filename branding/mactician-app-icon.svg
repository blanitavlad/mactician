<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mactician app icon</title>
  <desc id="desc">A premium navy macOS icon with two folded ribbons forming an M and two small green Ready lights.</desc>
  <defs>
