<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mactician: Keep playing TFT PBE on your Mac</title>
  <desc id="desc">A free, open-source launcher built so Apple Silicon players can keep enjoying TFT PBE.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="24%" r="100%">
      <stop stop-color="#321A53"/>
      <stop offset=".5" stop-color="#11162E"/>
      <stop offset="1" stop-color="#050913"/>
    </radialGradient>
    <linearGradient id="left" x1="84" y1="96" x2="270" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF58C8"/>
      <stop offset="1" stop-color="#753DE4"/>
    </linearGradient>
    <linearGradient id="right" x1="244" y1="410" x2="430" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7137DA"/>
      <stop offset="1" stop-color="#795CFF"/>
