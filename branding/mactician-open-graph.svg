  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M690-50 1260 520M610 40l570 570M760 0v630M980 0v630" fill="none" stroke="#C27AFF" stroke-opacity=".1" stroke-width="2"/>
  <text x="78" y="104" fill="#48F394" font-family="SFMono-Regular, monospace" font-size="20" font-weight="700" letter-spacing="5">MACTICIAN · TFT PBE LAUNCHER</text>
  <text x="74" y="250" fill="#FAF8FF" font-family="Avenir Next, sans-serif" font-size="86" font-weight="750" letter-spacing="-3">Keep playing TFT PBE</text>
  <text x="74" y="342" fill="#FAF8FF" font-family="Avenir Next, sans-serif" font-size="86" font-weight="750" letter-spacing="-3">on your Mac.</text>
  <text x="80" y="414" fill="#BFC3D9" font-family="Avenir Next, sans-serif" font-size="27">A native, open-source macOS experience for Apple Silicon.</text>
  <text x="80" y="540" fill="#D4B76D" font-family="Avenir Next, sans-serif" font-size="24" font-weight="600">Built for two tacticians. Shared with everyone.</text>
