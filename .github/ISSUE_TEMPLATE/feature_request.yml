name: Feature request
description: Propose a focused launcher or runtime improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the requested behavior and the smallest useful scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds or simpler alternatives.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who benefits, how often, and what becomes possible or easier?
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Willingness to contribute
      options:
        - I can prepare a pull request
        - I can help test a change
        - I can provide requirements or measurements
        - I cannot contribute an implementation
    validations:
      required: true
